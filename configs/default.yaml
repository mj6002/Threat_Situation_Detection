sampling:
  every_seconds: 0.5
  frames_per_segment: 6        # about 3 seconds per segment

fusion:
  mode: max                    # max | weighted_mean
  min_confidence: 0.3
  weights:
    violence: 1.0
    harassment_risk: 0.8       # less validated, so capped lower
    crowd: 1.0

alerts:
  threshold: 0.6
  min_consecutive: 3
  cooldown_seconds: 30
